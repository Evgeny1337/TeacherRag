services:
  teacher_db:
    image: pgvector/pgvector:pg18
    ports:
      - "${POSTGRES_HOST}:${POSTGRES_PORT}:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql
    restart: always
  teacher_redis:
    image: redis:7-alpine
    ports:
      - "${CELERY_PORT}:6379"
    volumes:
      - redisdata:/data
    command: redis-server --appendonly yes
    restart: always
  teacher_api:
    build: .
    image: teacher_api:local
    depends_on:
      - teacher_db
      - teacher_redis
    env_file:
      - .env
    environment:
      POSTGRES_HOST: teacher_db
      POSTGRES_PORT: "5432"
      CELERY_BROKER_URL: redis://teacher_redis:6379/0
      CELERY_RESULT_BACKEND: redis://teacher_redis:6379/1
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1,195.133.194.120
    ports:
      - "127.0.0.1:8003:8000"
    restart: always


volumes:
  pgdata:
  redisdata:
