services:
  teacher_db:
    image: pgvector/pgvector:pg18
    ports:
      - "${POSTGRES_HOST}:${POSTGRES_PORT}:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
    restart: always

volumes:
  pgdata:
